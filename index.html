<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSSM latest version</title>
<style>
  body { margin: 0; font-family: "Segoe UI", Arial, sans-serif; color: #000; background: #fff; line-height: 1.5; }
  main { max-width: 640px; margin: 64px auto; padding: 0 24px; }
  h1 { color: #003DA5; font-size: 26px; font-weight: 600; margin: 0 0 8px; }
  #version { font-size: 40px; font-weight: 600; margin: 0; }
  #critical { font-weight: 600; margin: 4px 0 0; }
  a { color: #003DA5; }
</style>
</head>
<body>
<main>
  <h1>OSSM latest version</h1>
  <p id="version"><a href="ossm-version.json">ossm-version.json</a></p>
  <p id="critical" hidden>A critical fix: every user should install it soon.</p>
  <p>Read from <a href="ossm-version.json">ossm-version.json</a>.</p>
</main>
<script>
  fetch("ossm-version.json", { cache: "no-store" })
    .then(function (response) { return response.json(); })
    .then(function (latest) {
      document.getElementById("version").textContent = latest.version;
      document.getElementById("critical").hidden = !latest.critical;
    })
    .catch(function () {});
</script>
</body>
</html>
